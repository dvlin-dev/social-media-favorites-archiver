[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "social-media-favorites-archiver"
version = "1.0.2"
description = "Archive personal social-media favorites into a local Markdown knowledge base."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Social Media Favorites Archiver contributors" }]
dependencies = [
  "filelock>=3.18",
  "httpx>=0.28",
  "imagehash>=4.3",
  "pillow>=11.0",
  "playwright>=1.50",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "rapidfuzz>=3.10",
  "typer>=0.15",
  "yt-dlp>=2025.1.0",
]

[project.optional-dependencies]
asr-funasr = ["funasr>=1.2"]
asr-mlx = [
  "mlx-whisper>=0.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
asr-faster-whisper = ["faster-whisper>=1.1"]
ocr = ["onnxruntime>=1.20", "rapidocr-onnxruntime>=1.4"]

[project.scripts]
smfa = "social_media_favorites_archiver.cli:app"

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/social_media_favorites_archiver"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
  "heavyweight: requires optional local models or large downloads",
  "live: requires an authorized live platform session",
]

[tool.coverage.run]
branch = true
source = ["social_media_favorites_archiver"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
